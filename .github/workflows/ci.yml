name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Importar assets
        run: godot --headless --path . --import || true
      - name: Rodar testes (GUT)
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
