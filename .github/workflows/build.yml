name: Build (Windows e Web)

# Exporta as duas plataformas e guarda como artefatos do workflow (baixe na aba Actions).
# Roda a cada push na main e sob demanda.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Instalar os templates de exportação
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Importar os assets
        run: godot --headless --path . --import || true
      - name: Exportar Web
        run: |
          mkdir -v -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Exportar Windows
        run: |
          mkdir -v -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/TowerDefenseRoguelite.exe
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
